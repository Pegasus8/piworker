# PiWorker Production Docker Compose
# Single container with embedded frontend

services:
  piworker:
    build:
      context: .
      dockerfile: Dockerfile
    image: piworker:latest
    container_name: piworker
    ports:
      - "8080:8080"
    volumes:
      - piworker-data:/app/data
    environment:
      - TZ=America/Argentina/Buenos_Aires
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    # Resource limits (good for Raspberry Pi)
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  piworker-data:
    driver: local
