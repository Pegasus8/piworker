# PiWorker Production Docker Compose
# Single container with embedded frontend

services:
  piworker:
    build:
      context: .
      dockerfile: Dockerfile
    image: piworker:latest
    container_name: piworker
    ports:
      - "8080:8080"
    volumes:
      - piworker-data:/app/data
    environment:
      # Optional first-account bootstrap; otherwise use the setup code in logs.
      - PIWORKER_ADMIN_USER=${PIWORKER_ADMIN_USER:-}
      - PIWORKER_ADMIN_PASS=${PIWORKER_ADMIN_PASS:-}
      # Names you use to open PiWorker (comma-separated). Inside the container
      # the hostname is the container's, so list the Docker host's name here;
      # localhost and IP addresses are always accepted.
      - PIWORKER_ALLOWED_HOSTS=${PIWORKER_ALLOWED_HOSTS:-raspberrypi,raspberrypi.local}
      - TZ=America/Argentina/Buenos_Aires
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    # Resource limits (good for Raspberry Pi)
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  piworker-data:
    driver: local
