# Air configuration for Go hot reload
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # Build command (disable VCS for Docker containers without git history)
  cmd = "go build -buildvcs=false -o ./tmp/main ."
  # Binary entrypoint with arguments (replaces deprecated bin/full_bin)
  entrypoint = ["./tmp/main", "-addr", ":8080", "-db", "/app/data/piworker.db", "-debug"]
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Exclude these directories
  exclude_dir = ["assets", "tmp", "vendor", "web", "node_modules", "internal/webui/dist"]
  # Exclude files matching these patterns
  exclude_file = []
  # Exclude regex patterns
  exclude_regex = ["_test.go"]
  # Exclude unchanged files
  exclude_unchanged = true
  # Follow symlinks
  follow_symlink = false
  # Delay before rebuilding (ms)
  delay = 1000
  # Stop running old binary before building
  stop_on_error = true
  # Send interrupt signal before killing
  send_interrupt = true
  # Delay after interrupt signal (ms)
  kill_delay = 500
  # Rerun binary when it exits
  rerun = false
  # Delay before rerunning (ms)
  rerun_delay = 500

[log]
  # Log time
  time = true
  # Only show main log
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean tmp directory on exit
  clean_on_exit = true
