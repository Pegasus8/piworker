# PiWorker configuration file.
# Copy to "piworker.toml" (auto-loaded) or pass an explicit path with -config.
#
# Effective precedence (highest wins):
#   command-line flags  >  environment variables  >  this file  >  built-in defaults

# HTTP server listen address.
addr = ":8080"

# SQLite database path.
db = "piworker.db"

# Enable debug logging.
debug = false

# Enable JWT authentication. When auth is true and jwt_secret is empty, a secret
# is generated and persisted in the database so tokens survive restarts.
auth = true

# JWT signing secret. Leave empty to auto-generate and persist one.
jwt_secret = ""

# Allowed CORS origins (credentials are only sent for specific allowlisted origins).
cors_origins = ["http://localhost:3000", "http://localhost:8080"]

# Initial admin credentials. Only used to bootstrap the very first user when auth
# is enabled and no users exist yet. Prefer providing these via the
# PIWORKER_ADMIN_USER / PIWORKER_ADMIN_PASS environment variables instead of
# committing them to a file.
admin_user = ""
admin_pass = ""
