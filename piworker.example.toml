# PiWorker configuration file.
# Copy to "piworker.toml" (auto-loaded) or pass an explicit path with -config.
#
# Effective precedence (highest wins):
#   command-line flags  >  environment variables  >  this file  >  built-in defaults

# Main listen address. Serves HTTPS unless [tls] mode = "off", in which case
# it serves plain HTTP (for example behind your own reverse proxy).
addr = ":8443"

# Plain HTTP listener that redirects browsers to HTTPS (308). It also serves
# /piworker-ca.crt (so a new device can download the CA) and, when
# webhooks_http is true, /webhooks/ directly. Set to "" to disable it.
# Unused when [tls] mode = "off".
http_addr = ":8080"

# Serve webhooks over plain HTTP on http_addr. Many devices (sensors,
# microcontrollers) cannot trust a local CA; webhook tokens are then sent
# unencrypted, so use this only on a network you trust.
webhooks_http = true

# SQLite database path.
db = "piworker.db"

# Enable debug logging.
debug = false

# Enable session authentication. A fresh database uses one-use browser setup;
# existing users keep their password. Sessions are persisted in SQLite.
auth = true

# Session cookies are always Secure when PiWorker serves HTTPS itself. Set true
# only with [tls] mode = "off" behind an HTTPS reverse proxy. This ONLY marks
# cookies Secure; it does not enable TLS. Forwarded headers are not trusted.
session_secure = false

# Allowed CORS origins (credentials are only sent for specific allowlisted origins).
cors_origins = ["http://localhost:3000", "http://localhost:8080"]

# Extra host names accepted in the Host header of /api, /mcp and the web UI
# (protects against DNS rebinding). localhost, this machine's hostname,
# <hostname>.local and any IP address are always accepted. Add the names you
# use to reach PiWorker otherwise, e.g. a DNS name or a reverse proxy's name.
# Env: PIWORKER_ALLOWED_HOSTS (comma-separated). Flag: -allowed-hosts.
allowed_hosts = []

# Optional unattended admin credentials. Only used to bootstrap the first user when auth
# is enabled and no users exist yet. Prefer providing these via the
# PIWORKER_ADMIN_USER / PIWORKER_ADMIN_PASS environment variables instead of
# committing them to a file.
admin_user = ""
admin_pass = ""

[tls]
# auto:   generate a local CA on first start (in the "tls" directory next to the
#         database) and a server certificate signed by it, renewed automatically.
#         Trust the CA once per device: open https://<device>:8443/trust.
# custom: use your own certificate (cert_file and key_file; reloaded on SIGHUP).
# off:    plain HTTP on addr. Recovery: -tls=off or PIWORKER_TLS_MODE=off.
mode = "auto"

# Extra names or IP addresses for the auto certificate, besides localhost, the
# host name, <hostname>.local and the current interface addresses (for example
# a DNS name on your router, or the host's address when running in Docker).
hosts = []

# PEM files for mode = "custom".
cert_file = ""
key_file = ""

[mcp]
# The MCP endpoint (/mcp) that lets AI agents (Claude Code, Claude Desktop
# through piworker-mcp, other MCP clients) call the flows you publish as tools.
# Agents connect with tokens you create under Agents in the editor; each token
# only gets the tools you grant. Requires auth = true. Restart to apply.
# Env: PIWORKER_MCP_ENABLED.
enabled = false

# With [tls] mode = "off", /mcp only answers clients on this machine
# (loopback), because tokens would cross the network unencrypted. Set true to
# accept clients on your network anyway. Ignored while TLS is on.
# Env: PIWORKER_MCP_LAN_ACCESS.
lan_access = false

# Agent tool calls running at once across all tokens (1-64; each token is also
# limited to 2). Env: PIWORKER_MCP_MAX_INFLIGHT.
max_inflight = 4

# Largest result returned to an agent, in bytes (1024-1048576); longer
# results are truncated. Env: PIWORKER_MCP_MAX_RESULT_BYTES.
max_result_bytes = 16384

# Let tokens get the author scope, which drafts flows for you to review and
# deploy. Env: PIWORKER_MCP_AUTHOR_ENABLED.
author_enabled = false
