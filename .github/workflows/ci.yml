name: CI
on:
  push:
    branches: [master, main, revival]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: make frontend-install
      - run: make fmt-check vet
      - run: go test -race ./...
      - run: make build-release
      - name: Install Linux cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - run: make build-linux build-arm64 build-arm
      - name: Package Linux binaries
        run: |
          for arch in amd64 arm64 arm; do
            tar -czf "build/piworker-linux-${arch}.tar.gz" -C build "piworker-linux-${arch}"
          done
          cd build
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            build/*.tar.gz
            build/SHA256SUMS
          if-no-files-found: error

  docker:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: build
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/*.tar.gz build/SHA256SUMS --draft --verify-tag --generate-notes
