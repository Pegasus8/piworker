# Mosquitto for docker-compose.zigbee.yml: a broker on the local network for
# Zigbee2MQTT and PiWorker. To require a password, create a password file
# (mosquitto_passwd -c /mosquitto/config/passwd piworker), set
# allow_anonymous false and password_file /mosquitto/config/passwd, and put
# the same user in Zigbee2MQTT's configuration and in PiWorker's connection.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
